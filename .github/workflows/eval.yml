name: LangSmith Evaluation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-eval:
    runs-on: ubuntu-latest


    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f DeepAgents/requirements.txt ]; then pip install -r DeepAgents/requirements.txt; fi
        pip install langsmith pytest langchain-google-genai

    - name: Run Director Agent Evaluation
      env:
        LANGCHAIN_TRACING_V2: "true"
        LANGCHAIN_API_KEY: "fffffffffffff"
        GOOGLE_API_KEY: "${{ secrets.GOOGLE_API_KEY }}"
        DEEPAGENTS_API_KEY: "${{ secrets.DEEPAGENTS_API_KEY }}"
      run: python DeepAgents/evaluations/run_director_eval.py
