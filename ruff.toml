# Enable fixing behavior generally
fix = true

[lint]
# Exclude these rules from being automatically fixed
# F401: Unused imports
# F841: Unused variables
# I: Import sorting (isort)
unfixable = ["F401", "F841", "I"]

# Ignore specific rules
# E402: Module level import not at top of file
# E722: Do not use bare 'except'
ignore = ["E402", "E722"]

# Select specific rules
select = ["E", "F", "I"]
